<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Plantilla · Formación y eventos · Poliescol</title>
<meta name="description" content="Plantilla 1080x1350 para capacitaciones, charlas y eventos internos. Fondo violeta, texto blanco, fecha en gran formato.">
<link rel="stylesheet" href="plantilla.css"></head>
<body>
<!-- USO: capacitaciones, charlas, jornadas, eventos. Color: violeta (sabiduría). La fecha es protagonista. -->
<main class="lienzo f-violeta">
  <p class="kicker" style="color:var(--p-verde)" data-editar="tipo" data-opciones="FORMACIÓN · CRECEMOS JUNTOS|EVENTO · CRECEMOS JUNTOS|CHARLA · CRECEMOS JUNTOS">Formación · Crecemos juntos</p>
  <h1 class="titular m" style="margin-top:28px" data-editar="titular">Masillas poliéster:<br>del taller al<br>acabado perfecto</h1>
  <p class="bajada" style="margin-top:32px;opacity:.9" data-editar="bajada">Una charla práctica para entender cómo se usan nuestros productos en la vida real del pintor.</p>
  <div style="margin-top:auto;margin-bottom:170px;display:flex;gap:20px">
    <div class="panel negro" style="border-radius:var(--p-radio) var(--p-radio-mayor) var(--p-radio) var(--p-radio);padding:40px 48px">
      <p class="titular" style="font-size:150px;color:var(--p-verde)" data-editar="dia">21</p>
      <p class="kicker" style="margin-top:8px" data-editar="mes">noviembre</p>
    </div>
    <div class="panel claro" style="flex:1;border-radius:var(--p-radio);padding:40px 48px;display:flex;flex-direction:column;justify-content:center">
      <p class="texto" data-editar="datos"><b class="destacado">Hora:</b> 2:00 p. m.<br><b class="destacado">Lugar:</b> sala de capacitación<br><b class="destacado">Para:</b> todo el equipo comercial</p>
    </div>
  </div>
  <footer class="firma"><img src="../descargas/poliescol-logo-principal-blanco.svg" alt="Poliescol"><span data-editar="area" data-opciones="Gestión Humana">Gestión Humana</span></footer>
</main>
</body></html>
