<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Plantilla · Bienvenida · poliescol</title>
<meta name="description" content="Plantilla 1080x1350 para dar la bienvenida a una persona nueva. Fondo aqua, texto negro, foto con esquinas de marca.">
<link rel="stylesheet" href="plantilla.css"></head>
<body>
<!-- USO: ingreso de una persona nueva. Color: aqua (confianza, comunicación clara). Foto de la persona obligatoria. -->
<main class="lienzo f-aqua">
  <p class="kicker" data-fijo="tipo">Nuevo en la familia</p>
  <h1 class="titular" style="margin-top:28px" data-editar="titular">Bienvenida,<br>Laura.</h1>
  <div style="display:flex;gap:48px;margin-top:56px;align-items:flex-end">
    <div class="foto" style="width:470px;height:560px;background-color:rgba(0,0,0,.06)" data-editar="foto">FOTO</div>
    <div style="flex:1;padding-bottom:10px">
      <p class="destacado" style="font-size:40px;line-height:1.1" data-editar="nombre">Laura Gómez</p>
      <p class="texto" style="margin-top:8px" data-editar="cargo">Analista de calidad<br>Planta La Estrella</p>
      <p class="texto" style="margin-top:36px" data-editar="mensaje">Llega a sumar su talento a nuestro equipo. Salúdala, cuéntale cómo trabajamos y hagámosla sentir en casa.</p>
    </div>
  </div>
  <footer class="firma"><img src="../descargas/poliescol-logo-principal-negro.svg" alt="poliescol"><span data-editar="area" data-opciones="Gestión Humana">Gestión Humana</span></footer>
</main>
</body></html>
