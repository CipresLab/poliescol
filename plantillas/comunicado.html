<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Plantilla · Comunicado interno · Poliescol</title>
<meta name="description" content="Plantilla 1080x1350 para comunicados informativos de Gestión Humana. Fondo negro, un solo color de acento (aqua).">
<link rel="stylesheet" href="plantilla.css"></head>
<body>
<!-- USO: avisos, cambios de horario, procesos, recordatorios. Acento: aqua. Máx. 1 mensaje por pieza. -->
<main class="lienzo f-negro">
  <div class="ventana" style="--s:210px;right:96px;top:96px" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <p class="kicker" style="color:var(--p-aqua)" data-editar="tipo" data-opciones="COMUNICADO|AVISO|RECORDATORIO">Comunicado</p>
  <h1 class="titular" style="margin-top:300px" data-editar="titular">Nuevo horario<br>de planta</h1>
  <p class="bajada" style="margin-top:36px;color:#cfcfcf" data-editar="bajada">Para que todos podamos descansar mejor, ajustamos la jornada a partir del próximo lunes.</p>
  <div class="panel claro" style="margin-top:auto;margin-bottom:150px;margin-left:-96px;padding-left:96px;width:calc(100% + 96px)">
    <p class="kicker" style="font-size:20px;opacity:.6">Lo que necesitas saber</p>
    <p class="texto" style="margin-top:14px" data-editar="datos"><b class="destacado">Desde:</b> lunes 18 de noviembre<br><b class="destacado">Turno:</b> 6:00 a. m. – 2:00 p. m.<br><b class="destacado">Dudas:</b> con tu líder o en Gestión Humana</p>
  </div>
  <footer class="firma"><img src="../descargas/poliescol-logo-principal-blanco.svg" alt="Poliescol"><span data-editar="area" data-opciones="Gestión Humana|Seguridad y Salud en el Trabajo">Gestión Humana</span></footer>
</main>
</body></html>
