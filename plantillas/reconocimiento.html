<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Plantilla · Reconocimiento · Poliescol</title>
<meta name="description" content="Plantilla 1080x1350 para reconocer logros, aniversarios y buenas prácticas. Fondo verde limón, texto negro.">
<link rel="stylesheet" href="plantilla.css"></head>
<body>
<!-- USO: logros, años de servicio, buenas prácticas. Color: verde (autenticidad, creatividad). Idea rectora: "tu trabajo es arte". -->
<main class="lienzo f-verde">
  <p class="kicker" data-editar="tipo" data-opciones="RECONOCIMIENTO|ANIVERSARIO|BUENA PRÁCTICA">Reconocimiento</p>
  <h1 class="titular" style="margin-top:28px" data-editar="titular">lo que haces<br>también es arte.</h1>
  <div class="panel negro" style="margin-top:auto;margin-bottom:170px;margin-right:-96px;display:grid;grid-template-columns:300px 1fr;gap:44px;align-items:center">
    <div class="foto" style="height:340px;color:#fff" data-editar="foto">FOTO</div>
    <div>
      <p class="numeral" style="color:var(--p-verde);font-size:110px" data-editar="cifra">10</p>
      <p class="destacado" style="font-size:30px;color:var(--p-verde);letter-spacing:.06em;text-transform:uppercase;margin-top:4px" data-editar="cifra_texto">años con nosotros</p>
      <p class="destacado" style="font-size:44px;margin-top:26px" data-editar="nombre">María Restrepo</p>
      <p class="texto" style="margin-top:6px;color:#cfcfcf" data-editar="detalle">Producción · Línea automotriz</p>
    </div>
  </div>
  <footer class="firma"><img src="../descargas/poliescol-logo-principal-negro.svg" alt="Poliescol"><span data-editar="area" data-opciones="Gracias, de corazón|Gestión Humana">Gracias, de corazón</span></footer>
</main>
</body></html>
