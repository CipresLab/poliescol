<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Plantilla · Cumpleaños · poliescol</title>
<meta name="description" content="Plantilla 1080x1350 para cumpleaños. Fondo negro, acento naranja, la ventana de luz en gran escala como celebración.">
<link rel="stylesheet" href="plantilla.css"></head>
<body>
<!-- USO: cumpleaños del mes o individual. Acento: naranja (entusiasmo). La ventana crece y se corta en el borde. -->
<main class="lienzo f-negro">
  <div class="ventana" style="--s:560px;right:-170px;top:-140px;transform:rotate(-8deg)" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="foto" style="width:340px;height:400px;color:#fff" data-editar="foto">FOTO</div>
  <p class="kicker" style="color:var(--p-naranja);margin-top:56px" data-editar="fecha">14 de noviembre</p>
  <h1 class="titular" style="margin-top:18px;font-size:124px" data-editar="titular">Feliz<br>cumple,<br><span style="color:var(--p-naranja)">Andrés.</span></h1>
  <p class="bajada" style="margin-top:32px;max-width:760px;color:#d0d0d0" data-editar="mensaje">Gracias por todo lo que pones en cada día. Que este año crezcas en todo sentido.</p>
  <footer class="firma"><img src="../descargas/poliescol-logo-principal-blanco.svg" alt="poliescol"><span data-editar="area" data-opciones="Tu familia|Gestión Humana">Tu familia</span></footer>
</main>
</body></html>
