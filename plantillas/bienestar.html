<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Plantilla · Bienestar y cuidado · Poliescol</title>
<meta name="description" content="Plantilla 1080x1350 para pausas activas, salud, seguridad y bienestar. Fondo gris claro, pasos numerados con los cuatro colores.">
<link rel="stylesheet" href="plantilla.css"></head>
<body>
<!-- USO: pausas activas, seguridad, salud, tips. Fondo claro. Pasos numerados 01. 02. 03. (máx. 4 pasos, uno por color). -->
<main class="lienzo f-claro">
  <p class="kicker" style="color:var(--p-violeta)" data-editar="tipo">Bienestar · Nos cuidamos</p>
  <h1 class="titular" style="margin-top:28px" data-editar="titular">3 minutos<br>para ti.</h1>
  <p class="bajada" style="margin-top:28px;color:#333" data-editar="bajada">Una pausa activa a las 10:00 a. m. Tu cuerpo es tu herramienta más valiosa.</p>
  <ol style="list-style:none;margin-top:56px;display:grid;gap:18px">
    <li style="display:grid;grid-template-columns:120px 1fr;align-items:center;background:#fff;border-radius:0 var(--p-radio) var(--p-radio) 0;overflow:hidden">
      <span class="titular m" style="background:var(--p-verde);height:100%;display:grid;place-items:center;font-size:56px;padding:26px 0">01.</span>
      <span class="texto" style="padding:0 36px" data-editar="paso1">Gira los hombros hacia atrás 10 veces.</span></li>
    <li style="display:grid;grid-template-columns:120px 1fr;align-items:center;background:#fff;border-radius:0 var(--p-radio) var(--p-radio) 0;overflow:hidden">
      <span class="titular m" style="background:var(--p-aqua);height:100%;display:grid;place-items:center;font-size:56px;padding:26px 0">02.</span>
      <span class="texto" style="padding:0 36px" data-editar="paso2">Estira los brazos y abre las manos.</span></li>
    <li style="display:grid;grid-template-columns:120px 1fr;align-items:center;background:#fff;border-radius:0 var(--p-radio) var(--p-radio) 0;overflow:hidden">
      <span class="titular m" style="background:var(--p-naranja);height:100%;display:grid;place-items:center;font-size:56px;padding:26px 0">03.</span>
      <span class="texto" style="padding:0 36px" data-editar="paso3">Respira profundo y toma agua.</span></li>
  </ol>
  <footer class="firma"><img src="../assets/logo-negro.svg" alt="Poliescol"><span data-editar="area">Seguridad y Salud en el Trabajo</span></footer>
</main>
</body></html>
